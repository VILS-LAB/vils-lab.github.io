<!DOCTYPE html>
<html lang="en" data-dark="false">
  {% include head.html %}
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    {% include header.html %}
    <main id="main-content" tabindex="-1" {% if page.editorial %}class="editorial"{% endif %}>
      {% if page.editorial %}
      {{ content }}
      {% else %}
      {% include content.html content=content %}
      {% endif %}
    </main>
    {% include footer.html %}
  </body>
</html>
