# site properties and page defaults
title: VILS-LAB
supervisor: Dr. Arash Abdi
subtitle: 
description: Vision Intelligence and Learning Systems Laboratory, supervised by Dr. Arash Abdi. Research in computer vision, reinforcement learning, and language models for cybersecurity.
header: images/background.jpg
footer: images/background.jpg
proofer: false

# site social media and other links
links:
  github: VILS-LAB

### jekyll settings

# front matter defaults
defaults:
  # all markdown files
  - scope:
      path: ""
    values:
      layout: default
  # markdown files in /_members
  - scope:
      type: "members"
    values:
      layout: research-profile
      editorial: true
  # markdown files in /_posts
  - scope:
      type: "posts"
    values:
      layout: post

collections:
  # generate page for each member
  members:
    output: true
  # generate page for each post
  posts:
    output: true

# jekyll plugins
plugins:
  - jekyll-spaceship
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-feed
  - jekyll-last-modified-at

# code block syntax highlighting
highlighter: rouge

# jekyll theme
theme: null

# sass settings
sass:
  sass_dir: _styles

# force jekyll to include certain files/folders
include:
  - _styles
  - _scripts

# force jekyll to exclude certain files/folders
exclude:
  - README.md
  - LICENSE.md
  - CITATION.cff
  # Retain template examples in source, without publishing them as lab work.
  - _members/jane-smith.md
  - _members/john-doe.md
  - _members/sarah-johnson.md
  - _posts/2019-01-07-example-post-1.md
  - _posts/2021-09-30-example-post-2.md
  - _posts/2023-02-23-example-post-3.md
  - DESIGN.md
  - EDITING-fa.md
